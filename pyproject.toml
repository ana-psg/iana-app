[project]
name = "iana"
version = "1.2.0"
description = "iAna: assistente pessoal de IA que roda no seu computador com Ollama"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "historico", "memoria", "audio"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textos em português têm acentos e travessões de propósito
    "SIM105",                      # try/except/pass é mais claro que contextlib.suppress aqui
    "E501",                        # o formatador cuida das linhas; só textos longos passam do limite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["iana"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
